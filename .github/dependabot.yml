version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Almaty
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    commit-message:
      prefix: build
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
