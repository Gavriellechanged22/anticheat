name: Defect report
description: Report reproducible incorrect behavior in the driver, collector, protocol, or tooling.
title: "fix: "
labels:
  - bug
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - User-mode collector
        - Kernel driver
        - Driver protocol
        - Portable core
        - Log verifier
        - Build or CI
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Version or commit
      placeholder: Commit SHA or release version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include Windows build, architecture, SDK/WDK, compiler, and signing mode when relevant.
      placeholder: Windows 11 24H2, x64, VS 2022 17.x, SDK/WDK 10.0.x
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Observed behavior
      description: State the exact failure, error code, and affected output.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the minimal ordered commands or API operations.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Diagnostic evidence
      description: Include sanitized logs, CI links, debugger output, or crash identifiers. Do not publish sensitive dumps.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I reproduced the issue on the current `main` branch.
          required: true
        - label: This report does not disclose a security vulnerability or sensitive data.
          required: true
